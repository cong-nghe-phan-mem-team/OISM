<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - OISM3</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">
            <h1>Create Account</h1>
            <p>Create your tenant and owner account</p>
        </div>


        <form id="registerForm" class="auth-form">

            <!-- Tenant Name -->
            <div class="form-field">
                <label for="tenantName">
                    Tenant Name
                </label>

                <input
                    type="text"
                    id="tenantName"
                    placeholder="Enter tenant name"
                    required>
            </div>


            <!-- Full Name -->
            <div class="form-field">
                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>
            </div>


            <!-- Email -->
            <div class="form-field">
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>


            <!-- Phone -->
            <div class="form-field">
                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone">
            </div>


            <!-- Password -->
            <div class="form-field">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>
            </div>


            <button
                type="submit"
                class="primary-btn">
                Register
            </button>

        </form>


        <div
            id="registerResult"
            class="result-box empty">
        </div>


        <div class="auth-footer">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </div>

    </div>

</div>


<script src="js/register.js"></script>

</body>
</html>
