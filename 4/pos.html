<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OISM3 - POS</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

    <div class="sidebar-logo">
        <div class="logo">OISM3</div>
        <div class="logo-subtitle">Management System</div>
    </div>

    <nav class="sidebar-nav">

        <a href="dashboard.html" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Dashboard</span>
        </a>

        <a href="products.html" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>Catalog</span>
        </a>

        <a href="inventory.html" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Inventory</span>
        </a>

        <a href="orders.html" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span>Orders</span>
        </a>

        <a href="pos.html" class="nav-item active">
            <span class="nav-icon">💳</span>
            <span>POS</span>
        </a>

    </nav>

    <button class="logout-btn" onclick="logout()">
        🚪 Logout
    </button>

</aside>


    <!-- MAIN -->
    <main class="main-content pos-page">

        <div class="page-header">

            <div>

                <h1>Point of Sale</h1>

                <p>
                    Process an in-store customer checkout
                </p>

            </div>

        </div>


        <div class="pos-container">


            <!-- PRODUCTS -->
            <div class="feature-card pos-products">

                <div class="feature-title">

                    <div class="feature-icon">
                        🛍️
                    </div>

                    <div>

                        <h2>Products</h2>

                        <p>
                            Add products to checkout
                        </p>

                    </div>

                </div>


                <form
                    class="modern-form"
                    id="checkoutForm">


                    <div id="posItemsContainer"></div>


                    <button
                        type="button"
                        class="secondary-btn"
                        onclick="addPosItemRow()">

                        + Add Product

                    </button>


                    <div class="subsection pos-payment">

                        <h3>
                            💰 Payment
                        </h3>

                    </div>


                    <div class="input-grid">

                        <div class="form-field">

                            <label>
                                Discount (VND)
                            </label>

                            <input
                                type="number"
                                id="discount"
                                placeholder="0"
                                value="0">

                        </div>


                        <div class="form-field">

                            <label>
                                Payment Method
                            </label>

                            <select id="paymentMethod">

                                <option value="Cash">
                                    Cash
                                </option>

                                <option value="Card">
                                    Card
                                </option>

                                <option value="QR">
                                    QR
                                </option>

                            </select>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="checkout-btn">

                        💳 Complete Payment

                    </button>

                </form>


                <div
                    class="result-box empty"
                    id="checkoutResult">
                </div>

            </div>

        </div>

    </main>

</div>


<script src="js/api.js"></script>
<script src="js/pos.js"></script>

</body>
</html>
