<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OISM3 - Orders</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

    <div class="sidebar-logo">
        <div class="logo">OISM3</div>
        <div class="logo-subtitle">Management System</div>
    </div>

    <nav class="sidebar-nav">

        <a href="dashboard.html" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Dashboard</span>
        </a>

        <a href="products.html" class="nav-item">
            <span class="nav-icon">📦</span>
            <span>Catalog</span>
        </a>

        <a href="inventory.html" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Inventory</span>
        </a>

        <a href="orders.html" class="nav-item active">
            <span class="nav-icon">🛒</span>
            <span>Orders</span>
        </a>

        <a href="pos.html" class="nav-item">
            <span class="nav-icon">💳</span>
            <span>POS</span>
        </a>

    </nav>

    <button class="logout-btn" onclick="logout()">
        🚪 Logout
    </button>

</aside>


    <!-- MAIN -->
    <main class="main-content">

        <div class="page-header">

            <div>

                <h1>Orders</h1>

                <p>
                    Create and manage customer orders
                </p>

            </div>

        </div>


        <!-- CREATE ORDER -->
        <div class="feature-card">

            <div class="feature-title">

                <div class="feature-icon">
                    🛒
                </div>

                <div>

                    <h2>Create New Order</h2>

                    <p>
                        Create an order and add products
                    </p>

                </div>

            </div>


            <form
                class="modern-form"
                id="createOrderForm">


                <div class="input-grid">

                    <div class="form-field">

                        <label>Branch ID</label>

                        <input
                            type="text"
                            id="branchId"
                            placeholder="1"
                            required>

                    </div>


                    <div class="form-field">

                        <label>Sales Channel</label>

                        <select id="salesChannel">

                            <option value="pos">
                                POS
                            </option>

                            <option value="shopee">
                                Shopee
                            </option>

                            <option value="tiktok">
                                TikTok
                            </option>

                            <option value="lazada">
                                Lazada
                            </option>

                            <option value="website">
                                Website
                            </option>

                        </select>

                    </div>

                </div>


                <div class="subsection">

                    <h3>
                        📦 Order Items
                    </h3>

                    <p>
                        Add products to this order
                    </p>

                </div>


                <div id="orderItemsContainer"></div>


                <button
                    type="button"
                    class="secondary-btn"
                    onclick="addOrderItemRow()">

                    + Add Product

                </button>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-btn">

                        🛒 Create Order

                    </button>

                </div>

            </form>


            <div
                class="result-box empty"
                id="createOrderResult">
            </div>

        </div>


        <!-- ORDER ACTION -->
        <div class="feature-card">

            <div class="feature-title">

                <div class="feature-icon">
                    ⚙️
                </div>

                <div>

                    <h2>Order Actions</h2>

                    <p>
                        Reserve, confirm or cancel an order
                    </p>

                </div>

            </div>


            <form
                class="modern-form"
                id="orderActionForm">


                <div class="input-grid">

                    <div class="form-field">

                        <label>Order ID</label>

                        <input
                            type="number"
                            id="actionOrderId"
                            placeholder="1"
                            required>

                    </div>


                    <div class="form-field">

                        <label>Action</label>

                        <select id="actionType">

                            <option value="reserve">
                                Reserve
                            </option>

                            <option value="confirm">
                                Confirm
                            </option>

                            <option value="cancel">
                                Cancel
                            </option>

                            <option value="pos_checkout">
                                POS Checkout
                            </option>

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-btn">

                    ⚡ Execute Action

                </button>

            </form>


            <div
                class="result-box empty"
                id="actionResult">
            </div>

        </div>

    </main>

</div>


<script src="js/api.js"></script>
<script src="js/orders.js"></script>

</body>
</html>
